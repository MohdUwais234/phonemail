name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phonemail
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: phonemail_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U phonemail -d phonemail_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck, test on PostgreSQL 16, and build (Docker Node 22)
        run: |
          docker run --rm --network host -v "$PWD:/workspace" -w /workspace \
            -e TEST_DATABASE_URL=postgres://phonemail:test_password@127.0.0.1:5432/phonemail_test \
            node:22-bookworm-slim sh -c 'npm ci && npm run typecheck && npm test && npm run build && npm audit --omit=dev'
      - name: Verify backend image
        run: docker build -f backend/Dockerfile -t phonemail-api .
      - uses: actions/upload-artifact@v4
        with:
          name: phonemail-web
          path: web/dist
