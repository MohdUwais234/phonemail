name: Android APK
on:
  push:
    branches: ["arena/01a0e723-phonemailai", "main"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Reachable HTTPS API base URL, without trailing slash or /api unless deployed under /api"
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.PHONEMAIL_API_URL || 'https://api.phonemail.invalid' }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate API URL
        run: |
          case "$VITE_API_URL" in https://*) ;; *) echo 'HTTPS API URL required'; exit 1;; esac
          if [ "$VITE_API_URL" = 'https://api.phonemail.invalid' ]; then
            echo '::warning::Build-only APK: configure PHONEMAIL_API_URL or workflow input for functional API connectivity.'
          fi
      - name: Build shared frontend and sync Capacitor in Docker
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm-cache -v "$PWD:/workspace" -w /workspace -e VITE_API_URL \
            node:22-bookworm-slim sh -c 'npm ci && npm run build -w web && npm run android:sync'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile debug APK
        working-directory: web/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Publish build failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then
            python3 - <<'PYCODE' > "$RUNNER_TEMP/check.json"
          import json, os
          text=open(os.environ['RUNNER_TEMP']+'/android-build.log').read()[-55000:]
          print(json.dumps({'name':'Android build diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'failure','output':{'title':'Gradle build failure','summary':'```text\n'+text+'\n```'}}))
          PYCODE
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phonemail-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
  launch-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: phonemail-debug-apk
          path: apk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb shell am start -W -n com.phonemail.app/.MainActivity
            sleep 10
            adb shell pidof com.phonemail.app
            adb exec-out screencap -p > android-launch.png
            adb logcat -d -s AndroidRuntime > android-runtime.log
            if grep -q 'FATAL EXCEPTION' android-runtime.log; then cat android-runtime.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-evidence
          path: |
            android-launch.png
            android-runtime.log
