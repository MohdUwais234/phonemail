name: Android APK
on:
  push:
    branches: ["arena/01a0e723-phonemailai", "main"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS API base, or http://127.0.0.1:3000 for USB local development"
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.PHONEMAIL_API_URL || 'http://127.0.0.1:3000' }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate API URL
        run: |
          case "$VITE_API_URL" in
            https://*) echo "PHONEMAIL_ANDROID_LOCAL=false" >> "$GITHUB_ENV" ;;
            http://127.0.0.1:3000|http://10.0.2.2:3000) echo "PHONEMAIL_ANDROID_LOCAL=true" >> "$GITHUB_ENV" ;;
            *) echo 'Use HTTPS or an explicitly supported local-debug address'; exit 1 ;;
          esac
      - name: Build shared frontend and sync Capacitor in Docker
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e VITE_API_URL -e PHONEMAIL_ANDROID_LOCAL \
            node:22-bookworm-slim sh -c 'npm ci && npm run build -w web && npm run android:sync'
          sudo chown -R "$(id -u):$(id -g)" node_modules web/android web/dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile debug APK
        working-directory: web/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Publish build failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then
            python3 - <<'PYCODE' > "$RUNNER_TEMP/check.json"
          import json, os
          text=open(os.environ['RUNNER_TEMP']+'/android-build.log').read()[-55000:]
          print(json.dumps({'name':'Android build diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'failure','output':{'title':'Gradle build failure','summary':'```text\n'+text+'\n```'}}))
          PYCODE
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phonemail-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
  launch-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.PHONEMAIL_API_URL || 'http://127.0.0.1:3000' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: phonemail-debug-apk
          path: apk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Start local API for native acceptance
        run: |
          cp .env.example .env
          sed -i 's/OTP_PROVIDER=twilio/OTP_PROVIDER=dev/' .env
          docker compose up --build -d backend
          timeout 180 sh -c 'until curl -fsS http://localhost:3000/health >/dev/null; do sleep 3; done'
          docker logs -f "$(docker compose ps -q backend)" > /tmp/phonemail-native-otp.log 2>&1 &
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb reverse tcp:3000 tcp:3000
            adb shell am start -W -n com.phonemail.app/.MainActivity
            sleep 10
            adb shell pidof com.phonemail.app
            adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof com.phonemail.app | tr -d '\r')
            docker run --rm --network host -v "$PWD:/workspace" -v /tmp/phonemail-native-otp.log:/tmp/otp.log:ro -w /workspace -e OTP_LOG_FILE=/tmp/otp.log -e VITE_API_URL node:22-bookworm-slim sh -c 'npm ci && node tests/android-smoke.mjs first'
            adb shell am force-stop com.phonemail.app
            adb shell am start -W -n com.phonemail.app/.MainActivity
            sleep 5
            adb forward tcp:9222 localabstract:webview_devtools_remote_$(adb shell pidof com.phonemail.app | tr -d '\r')
            docker run --rm --network host -v "$PWD:/workspace" -w /workspace -e VITE_API_URL node:22-bookworm-slim node tests/android-smoke.mjs restored
            adb exec-out screencap -p > android-launch.png
            adb logcat -d -s AndroidRuntime > android-runtime.log
            if grep -q 'FATAL EXCEPTION' android-runtime.log; then cat android-runtime.log; exit 1; fi
      - name: Publish native test diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f native-test-diagnostic.txt ]; then
            python3 - <<'PYCODE' > "$RUNNER_TEMP/native-check.json"
          import json, os
          text=open('native-test-diagnostic.txt').read()[-55000:]
          print(json.dumps({'name':'Native test diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'failure','output':{'title':'Native test failure','summary':text}}))
          PYCODE
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/native-check.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-evidence
          path: |
            android-launch.png
            android-runtime.log
            native-test-diagnostic.txt
      - name: Stop API
        if: always()
        run: docker compose down
