name: Android APK
on:
  push:
    branches: ["arena/01a0e723-phonemailai", "main"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Reachable HTTPS API base URL, without trailing slash or /api unless deployed under /api"
        required: true
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.PHONEMAIL_API_URL || 'https://api.phonemail.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate API URL
        run: |
          case "$VITE_API_URL" in https://*) ;; *) echo 'HTTPS API URL required'; exit 1;; esac
          if [ "$VITE_API_URL" = 'https://api.phonemail.invalid' ]; then
            echo '::warning::Build-only APK: configure PHONEMAIL_API_URL or workflow input for functional API connectivity.'
          fi
      - name: Build shared frontend and sync Capacitor in Docker
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e VITE_API_URL \
            node:22-bookworm-slim sh -c 'npm ci && npm run build -w web && npm run android:sync'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Compile debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phonemail-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
